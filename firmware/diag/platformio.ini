; Amped-ESP32-Plus bring-up diagnostic: I2C scan, PCM5122 status, I2S tone.
; Flash: ~/.platformio/penv/bin/pio run -t upload   (then pio device monitor)
; Re-flash the stock snapclient firmware afterwards.

[env:diag]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; This board's CH340 drops data above 115200.
upload_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1
