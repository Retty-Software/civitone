# Snapcast server config for Civitone development.
# The controller launches snapserver with this file. Edit buffer / chunk_ms
# during the bench test; the controller will own these values later.

[stream]
# Sources are adopted, not configured: the controller adds one stream per
# adopted source at runtime (tcp://127.0.0.1:4960+). Only internal streams
# live here.
#
# None comes first, so it's the stream new speakers land on: silence until an
# operator picks a source. Nothing ever feeds it.
source = tcp://127.0.0.1:4950?name=None&mode=server&sampleformat=48000:16:2
# Identify chime: the controller moves one node's group here and plays a
# bell arpeggio (cmd/civitone/identify.go). Hidden in the console.
source = tcp://127.0.0.1:4955?name=Chime&mode=server&sampleformat=48000:16:2
# Sync buffer in ms. Parade target 200, festival 800. Start high on the bench.
buffer = 1000
# Chunk size in ms. snapserver resyncs every node if its read timer wakes
# later than one chunk, so this is also its stall tolerance. 50 cut audible
# resyncs from ~5 to 1 per 2.5 min on the bench Mac (Oct 6, 2026). Don't go
# to 80: upstream snapclient issue #239 reports ESP32 sync trouble there.
chunk_ms = 50
# Opus at 128 kbps instead of 1.5 Mbps PCM per node: what lets a city Wi-Fi
# cell or a cloud server carry the fleet. The pole mix is mono, so 128k
# stereo with identical channels is transparent for PA horns. Nodes decode
# Opus and FLAC; use flac for lossless on a strong private network, pcm only
# to rule the codec out while debugging.
codec = opus:BITRATE:128000
sampleformat = 48000:16:2

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780

[tcp-control]
enabled = true
bind_to_address = 127.0.0.1
port = 1705

[server]
threads = -1

[logging]
sink = stdout
filter = *:info
